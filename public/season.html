<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Map - BCU Map</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        /* ==========================================
           MAP EXTRA
        ========================================== */

        #mapExtra {
            margin-top: 25px;
            font-family:
                "Mulmaru",
                sans-serif;
        }


        #mapDescriptionTitle {
            margin-bottom: 8px;
        }


        #mapDescription {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.7;
            margin-bottom: 20px;
        }


        #mapDownload {
            margin-top: 15px;
        }


        #mapDownload a {
            display: inline-block;

            padding: 10px 18px;

            border: 2px solid currentColor;
            border-radius: 10px;

            color: inherit;

            font-family:
                "Pixelify Sans",
                sans-serif;

            text-decoration: none;

            cursor: pointer;

            transition:
                background 0.15s ease,
                color 0.15s ease,
                scale 0.15s ease;
        }


        #mapDownload a:hover {
            background: #111;
            color: #fff;

            scale: 1.08;
        }


        body.white-mode
        #mapDownload a:hover {
            background: #fff;
            color: #111;
        }


        /* app.js가 만드는 기존 다운로드 링크는 숨김 */
        #seasonDetails
        a[href*="/download"] {
            display: none;
        }

    </style>
</head>


<body>

    <main class="page">

        <!-- app.js가 제목 / Creator / Version 등을 표시 -->
        <div id="seasonDetails">

            <p>
                Loading...
            </p>

        </div>


        <!-- Description + Download Map -->
        <div id="mapExtra">

            <h2 id="mapDescriptionTitle">
                Description:
            </h2>

            <p id="mapDescription">
                Loading...
            </p>

            <div id="mapDownload">
                Loading...
            </div>

        </div>


        <button
            type="button"
            onclick="location.href='seasons.html'"
        >
            Back
        </button>

    </main>


    <script src="js/app.js"></script>

    <script src="js/seasons.js"></script>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            async function() {

                const params =
                    new URLSearchParams(
                        location.search
                    );

                const id =
                    params.get("id");


                const description =
                    document.getElementById(
                        "mapDescription"
                    );


                const download =
                    document.getElementById(
                        "mapDownload"
                    );


                if (!id) {

                    description.textContent =
                        "No description.";

                    download.innerHTML = "";

                    return;

                }


                try {

                    const response =
                        await fetch(
                            "/api/maps/" +
                            encodeURIComponent(id),
                            {
                                cache: "no-store"
                            }
                        );


                    const map =
                        await response.json();


                    if (!response.ok) {

                        description.textContent =
                            "No description.";

                        download.innerHTML = "";

                        return;

                    }


                    /* ==========================
                       DESCRIPTION
                    ========================== */

                    description.textContent =
                        map.description &&
                        String(
                            map.description
                        ).trim()
                            ? map.description
                            : "No description.";


                    /* ==========================
                       DOWNLOAD MAP
                    ========================== */

                    if (map.file) {

                        const link =
                            document.createElement(
                                "a"
                            );


                        link.href =
                            "/api/maps/" +
                            encodeURIComponent(id) +
                            "/download";


                        link.textContent =
                            "Download Map";


                        download.innerHTML =
                            "";


                        download.appendChild(
                            link
                        );

                    } else {

                        download.innerHTML =
                            "";

                    }

                }
                catch (error) {

                    console.error(
                        "[BCU MAP] Failed to load map extra information:",
                        error
                    );


                    description.textContent =
                        "No description.";

                    download.innerHTML =
                        "";

                }

            }
        );

    </script>

</body>

</html>
