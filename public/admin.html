<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dont Ask What is This</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <main class="page">

        <h1>Bcu Map Adder</h1>


        <!-- ==========================================
             ADD MAP
        =========================================== -->

        <section class="panel">

            <h2>Add Map</h2>

            <form id="seasonForm">


                <!-- Map Name -->

                <label for="name">
                    Map Name
                </label>

                <input
                    type="text"
                    id="name"
                    maxlength="100"
                    placeholder="The Beginning"
                    required
                >


                <!-- Creator -->

                <label for="creator">
                    Creator
                </label>

                <input
                    type="text"
                    id="creator"
                    maxlength="50"
                    placeholder="Creator"
                >


                <!-- Version -->

                <label for="version">
                    Version
                </label>

                <input
                    type="text"
                    id="version"
                    maxlength="30"
                    placeholder="1.0"
                >


                <!-- Description -->

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    maxlength="5000"
                    placeholder="Map description"
                ></textarea>


                <!-- File -->

<label>
    File
</label>

<div class="file-picker">

    <input
        type="file"
        id="file"
        required
    >

    <label
        for="file"
        class="file-picker-button"
    >
        Select File
    </label>

    <span
        id="selectedFileName"
        class="selected-file-name"
    > 
        No file selected
    </span>

</div>

                <!-- Submit -->

                <button type="submit">
                    Add Map
                </button>

            </form>

        </section>


        <!-- ==========================================
             CURRENT MAPS
        =========================================== -->

        <section class="panel">

            <h2>Current Maps</h2>

            <div id="adminSeasonList">

                <p>
                    No maps have been added yet.
                </p>

            </div>

        </section>


        <!-- ==========================================
             BACK
        =========================================== -->

        <button
            type="button"
            onclick="location.href='index.html'"
        >
            Back
        </button>


    </main>


    <script src="js/app.js"></script>

</body>

</html>
