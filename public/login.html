<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - BCU Map</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="page">

        <h1>Login</h1>

        <section class="panel">

            <form id="loginForm">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    autocomplete="username"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

        </section>

        <p>
            Don't have an account?
        </p>

        <button onclick="location.href='signup.html'">
            Sign Up
        </button>

        <br><br>

        <button onclick="location.href='index.html'">
            Back
        </button>

    </main>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
